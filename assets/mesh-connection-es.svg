<svg width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><title id="title">Flujo de conexión DSH Mobile Mesh</title><desc id="desc">La aplicación Android se conecta a DeepSeek Harness mediante ZeroTier o Tailscale, con reenvío SSH opcional.</desc><defs><linearGradient id="app" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6675C7"/><stop offset="1" stop-color="#394A9A"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#6675C7"/></marker></defs><rect width="760" height="230" rx="20" fill="#F6F7FC"/><rect x="35" y="65" width="190" height="100" rx="16" fill="url(#app)"/><text x="130" y="98" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="700">Aplicación Android</text><text x="130" y="124" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">Nodo Mesh userspace</text><text x="130" y="146" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">Reenvío privado</text><rect x="535" y="65" width="190" height="100" rx="16" fill="#20243A"/><text x="630" y="98" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="700">Servidor / ordenador</text><text x="630" y="124" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">DeepSeek Harness</text><text x="630" y="146" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">HTTP / WebSocket nativo</text><path d="M235 105H525" stroke="#6675C7" stroke-width="4" marker-end="url(#arrow)"/><path d="M525 130H235" stroke="#A9B5F0" stroke-width="4" marker-end="url(#arrow)"/><text x="380" y="92" text-anchor="middle" fill="#394A9A" font-family="sans-serif" font-size="14" font-weight="700">ZeroTier / Tailscale</text><text x="380" y="153" text-anchor="middle" fill="#6675C7" font-family="sans-serif" font-size="13">Túnel SSH opcional</text></svg>
